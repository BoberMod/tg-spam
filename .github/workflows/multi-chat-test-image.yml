name: multi-chat test image

on:
  push:
    tags:
      - multi-chat-image-test

permissions:
  contents: read
  packages: write

concurrency:
  group: multi-chat-test-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CI=github
            GITHUB_SHA=${{ github.sha }}
            GIT_BRANCH=multi-chat-test
          tags: |
            ghcr.io/bobermod/tg-spam:multi-chat-test
            ghcr.io/bobermod/tg-spam:multi-chat-1f16842d
          cache-from: type=gha
          cache-to: type=gha,mode=max
